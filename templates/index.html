<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solana Scout Web</title><style>body{font:15px system-ui;background:#120f19;color:#f5edff;margin:20px}h1{color:#14f195}button,input{padding:10px;border-radius:8px}button{background:#7c3aed;color:white;border:0}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px;border-bottom:1px solid #40364b;text-align:right}th:first-child,td:first-child{text-align:left}a{color:#14f195}.scroll{overflow-x:auto}small{color:#bcaacc}</style></head><body><h1>◆ SOLANA SCOUT</h1><p>Read-only discovery scanner · iPad compatible</p><button onclick="scan()">Scan now</button> <label>Min liquidity $ <input id="liq" type="number" value="10000" style="width:95px" onchange="render()"></label><p id="status">Ready</p><div class="scroll"><table><thead><tr><th>Token</th><th>Age min</th><th>Liquidity</th><th>Cap/FDV</th><th>1h volume</th><th>Buys</th><th>Sells</th><th>1h %</th><th>Score</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><small>Discovery includes recently profiled/boosted tokens, not all launches. Activity score is not a safety assessment or buy signal. No wallet connection.</small><script>let data=[];const usd=n=>'$'+Math.round(n).toLocaleString();function render(){let min=Number(document.getElementById('liq').value)||0;document.getElementById('rows').innerHTML=data.filter(x=>x.liquidity>=min).map(x=>`<tr><td><a href="${x.url}" target="_blank" rel="noopener">${x.symbol.replaceAll('<','&lt;')}</a></td><td>${x.age??'—'}</td><td>${usd(x.liquidity)}</td><td>${usd(x.cap)}</td><td>${usd(x.volume)}</td><td>${x.buys}</td><td>${x.sells}</td><td>${x.change.toFixed(1)}%</td><td>${x.score}</td><td>${x.status}</td></tr>`).join('')}async function scan(){document.getElementById('status').textContent='Scanning…';try{let r=await fetch('/api/scan');if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();render();document.getElementById('status').textContent=data.length+' tokens · refreshed '+new Date().toLocaleTimeString()}catch(e){document.getElementById('status').textContent='Scan error: '+e.message}}scan();setInterval(scan,60000)</script></body></html>
